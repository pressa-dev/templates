title: Elegant cover letter
category: cover-letter
position: 5
summary: A refined serif cover letter with your name in small capitals, matching the elegant resume.
description: >-
  A quiet letter set in EB Garamond: your name in large small capitals centred over a fine accent rule and the contact line, then the date in italics, the recipient and your letter, as on the elegant resume.
instructions: >-
  Three or four short paragraphs: why this role, the two or three results that prove you can do it
  (the same facts as the resume, not new ones), and a closing line. Address a named person when the
  posting gives one. Never invent experience or claims about the company.
compiler: pdflatex
pairs_with: [elegant-resume]
document: cover-letter
design: Elegant
