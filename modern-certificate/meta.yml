title: Modern certificate
category: certificate
position: 2
summary: A modern landscape certificate with a colour panel down the side and a large sans-serif name.
description: >-
  A contemporary certificate in Lato: a colour panel down the left with the organization, date and certificate number, and the title, recipient, achievement and signature lines set large beside it. It takes exactly the same data as the other certificate designs.
instructions: >-
  Keep the title short (four words or fewer) and the achievement to one or two sentences. Use one to
  three signatures. When producing a batch, keep every field the same except recipient and
  certificate_id. Never add a signatory the user did not name.
compiler: pdflatex
