title: Classic academic CV
category: resume
position: 11
summary: A multi-page academic CV in Charter with coloured section rules and numbered publications.
description: >-
  A traditional academic CV set in Charter: a centred header over an accent rule, bold section headings with matching rules, numbered publications, appointments, grants and teaching, and your name and the page number in the footer. It takes exactly the same data as the other academic CV designs.
instructions: >-
  List publications newest first, with authors exactly as published and the venue as it appears in
  the journal. Appointments and education go newest first. Keep grants and awards to one line each,
  with the amount in the name when it is public. Never add a publication, grant or degree the person
  did not provide.
compiler: pdflatex
