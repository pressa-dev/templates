title: Executive monthly report
category: report
position: 3
summary: A serif board-style report with large KPI figures between fine rules and small-caps headings.
description: >-
  A board-ready report in Charter: a centred title over a double rule, KPI figures set large between fine vertical rules, small-caps section headings, a bar chart, a ruled metrics table, and highlights and next steps. It takes exactly the same data as the other report designs.
instructions: >-
  Send exactly four kpis, each with a label, a formatted value (e.g. "$142.4k") and a change line.
  chart is a list of label and numeric value pairs, oldest first, six to twelve points; say the unit
  in chart_title. Table values are strings, already formatted. Keep the summary to two or three
  sentences. Use only numbers the user provided; never estimate or round them into new claims.
compiler: pdflatex
pairs_with: []
document: monthly-report
design: Executive
