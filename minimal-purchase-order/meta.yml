title: Minimal purchase order
category: order
position: 4
summary: A quiet, airy purchase order in Helvetica with hairline rules and one accent colour.
description: >-
  A purchase order with a quiet Helvetica layout with generous white space, the key details in one row, hairline rules and only the total in colour. It takes exactly the same data as the other purchase order designs.
instructions: >-
  Send quantity, unit_price and tax_rate as numbers (tax_rate in percent, e.g. 6); the template
  computes every amount, so never send totals. currency is a code such as USD, EUR or GBP. sku may be
  empty. Do not invent prices, vendors, addresses or who authorized the order; ask the user.
compiler: pdflatex
pairs_with:
  - invoice
  - packing-slip
  - delivery-note
document: purchase-order
design: Minimal
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  teal: "0F766E"
  blue: "1D4ED8"
  burgundy: "8B1E3F"
  forest: "2D6A4F"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  buyer: "Your business"
  po_number: "PO number"
  vendor: "Vendor"
  ship_to: "Ship to"
  delivery_date: "Deliver by"
  sku: "Item no."
  tax_rate: "Tax rate (%)"
  authorized_by: "Authorized by"
