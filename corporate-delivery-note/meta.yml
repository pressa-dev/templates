title: Corporate delivery note
category: order
position: 5
summary: A structured delivery note with a top band, a monogram and a fully ruled grid.
description: >-
  A delivery note with a structured layout with a colour band across the top, a monogram from your business name, the details in a ruled grid and a fully ruled table. It takes exactly the same data as the other delivery note designs.
instructions: >-
  Send quantity as a number; the total is calculated, so never send it. sku is your item number and
  may be empty. tracking_number is shown as the delivery reference and may be empty. Do not invent
  addresses or order numbers; ask the user for any that are missing.
compiler: pdflatex
pairs_with:
  - invoice
  - purchase-order
document: delivery-note
design: Corporate
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  graphite: "374151"
  navy: "1F4E79"
  teal: "0F766E"
  burgundy: "8B1E3F"
  forest: "2D6A4F"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  sender: "Your business"
  ship_to: "Deliver to"
  order_number: "Order number"
  sku: "Item no."
  shipping_method: "Delivery method"
  tracking_number: "Delivery reference"
