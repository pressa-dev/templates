title: Modern academic CV
category: resume
position: 12
summary: A clean sans-serif academic CV in Lato with bracketed publication numbers in colour.
description: >-
  A contemporary academic CV in Lato: your name large with the position in the accent colour, small uppercase section headings, publications numbered in brackets, and your name and the page number in the footer. It takes exactly the same data as the other academic CV designs.
instructions: >-
  List publications newest first, with authors exactly as published and the venue as it appears in
  the journal. Appointments and education go newest first. Keep grants and awards to one line each,
  with the amount in the name when it is public. Never add a publication, grant or degree the person
  did not provide.
compiler: pdflatex
pairs_with: []
document: academic-cv
design: Modern
