title: Bold purchase order
category: order
position: 2
summary: A purchase order with your business name in a bold colour band and a colour header row.
description: >-
  A purchase order with a full-width colour band with your business name, a table with a colour header row and shaded rows, and the total on a solid colour bar. It takes exactly the same data as the other purchase order designs.
instructions: >-
  Send quantity, unit_price and tax_rate as numbers (tax_rate in percent, e.g. 6); the template
  computes every amount, so never send totals. currency is a code such as USD, EUR or GBP. sku may be
  empty. Do not invent prices, vendors, addresses or who authorized the order; ask the user.
compiler: pdflatex
pairs_with:
  - invoice
  - packing-slip
  - delivery-note
document: purchase-order
design: Bold
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  blue: "1D4ED8"
  navy: "1F4E79"
  teal: "0F766E"
  burgundy: "8B1E3F"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  buyer: "Your business"
  po_number: "PO number"
  vendor: "Vendor"
  ship_to: "Ship to"
  delivery_date: "Deliver by"
  sku: "Item no."
  tax_rate: "Tax rate (%)"
  authorized_by: "Authorized by"
