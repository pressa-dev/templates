title: Timeline academic CV
category: resume
position: 14
summary: An academic CV with dates in a column on the left, so your career reads as a timeline.
description: >-
  A structured academic CV in Source Sans: appointments, education, grants and teaching with their dates in a coloured column on the left, publications numbered in the same column, and section headings marked with an accent bar. It takes exactly the same data as the other academic CV designs.
instructions: >-
  List publications newest first, with authors exactly as published and the venue as it appears in
  the journal. Appointments and education go newest first. Keep grants and awards to one line each,
  with the amount in the name when it is public. Never add a publication, grant or degree the person
  did not provide.
compiler: pdflatex
pairs_with: []
document: academic-cv
design: Timeline
