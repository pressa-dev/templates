title: Classic delivery note
category: order
position: 3
summary: A traditional serif delivery note with small-caps labels and ruled lines.
description: >-
  A delivery note with a traditional serif layout in Charter with small-caps labels, the details in a neat column, a fine accent rule and a ruled table. It takes exactly the same data as the other delivery note designs.
instructions: >-
  Send quantity as a number; the total is calculated, so never send it. sku is your item number and
  may be empty. tracking_number is shown as the delivery reference and may be empty. Do not invent
  addresses or order numbers; ask the user for any that are missing.
compiler: pdflatex
pairs_with:
  - invoice
  - purchase-order
document: delivery-note
design: Classic
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  navy: "1F4E79"
  burgundy: "8B1E3F"
  forest: "2D6A4F"
  teal: "0F766E"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  sender: "Your business"
  ship_to: "Deliver to"
  order_number: "Order number"
  sku: "Item no."
  shipping_method: "Delivery method"
  tracking_number: "Delivery reference"
