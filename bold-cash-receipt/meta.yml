title: Bold cash receipt
category: receipt
position: 2
summary: A cash receipt with your business name in a bold colour band and the amount on a tinted bar.
description: >-
  A confident receipt in Source Sans: your business name, receipt number and date in white on a colour band, who paid, what for and how, the amount received large on a tinted bar, and lines for the name and signature of whoever took the payment. It fits the top half of an A4 page.
instructions: >-
  Send amount as a number and currency as a code such as USD, EUR or GBP. payment_method is usually
  Cash but can be cheque, card or transfer. Only fill in a receipt for a payment the user actually
  received; never invent a payer, an amount or a business, and never imitate another company's
  receipt.
compiler: pdflatex
pairs_with:
  - invoice
document: cash-receipt
design: Bold
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  blue: "1D4ED8"
  navy: "1F4E79"
  teal: "0F766E"
  burgundy: "8B1E3F"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  business: "Your business"
  received_from: "Received from"
  description: "For"
  amount: "Amount received"
