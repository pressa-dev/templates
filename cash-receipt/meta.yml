title: Framed cash receipt
category: receipt
position: 1
summary: A cash receipt sized for the top half of the page, with who paid, what for, the amount and a line for your signature.
description: >-
  A receipt card framed in green: your business name, address and phone with the receipt number and
  date, then who the payment came from, what it was for and how it was paid, the amount received set
  large on a shaded band, an optional note, and lines for the name and signature of whoever took the
  payment. With typical details it fits in the top half of an A4 page, so you can print it and cut it to size.
instructions: >-
  Send amount as a number and currency as a code such as USD, EUR or GBP. payment_method is usually
  Cash but can be cheque, card or transfer. Only fill in a receipt for a payment the user actually
  received; never invent a payer, an amount or a business, and never imitate another company's
  receipt.
compiler: pdflatex
pairs_with:
  - invoice
document: cash-receipt
design: Framed
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  green: "047857"
  teal: "0F766E"
  navy: "1F4E79"
  burgundy: "8B1E3F"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  business: "Your business"
  received_from: "Received from"
  description: "For"
  amount: "Amount received"
