title: Classic packing slip
category: order
position: 3
summary: A traditional serif packing slip with small-caps labels and ruled lines.
description: >-
  A packing slip with a traditional serif layout in Charter with small-caps labels, the details in a neat column, a fine accent rule and a ruled table. It takes exactly the same data as the other packing slip designs.
instructions: >-
  Send quantity as a number; the total item count is calculated, so never send it. sku is your item
  or SKU number and may be empty. Leave tracking_number empty if there is none yet. Do not invent
  addresses, order numbers or tracking numbers; ask the user for any that are missing.
compiler: pdflatex
pairs_with:
  - invoice
  - purchase-order
document: packing-slip
design: Classic
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  navy: "1F4E79"
  burgundy: "8B1E3F"
  forest: "2D6A4F"
  teal: "0F766E"
  graphite: "374151"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  sender: "Your business"
  ship_to: "Ship to"
  order_number: "Order number"
  sku: "Item no."
  tracking_number: "Tracking number"
