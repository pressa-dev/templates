title: Corporate cash receipt
category: receipt
position: 5
summary: A structured cash receipt with a monogram and every detail in a ruled grid.
description: >-
  A structured receipt: a monogram from your business name, the receipt number, date and payment method in a ruled grid, who paid and what for in a ruled table with the amount on a solid colour row, and lines for the name and signature. It fits the top half of an A4 page.
instructions: >-
  Send amount as a number and currency as a code such as USD, EUR or GBP. payment_method is usually
  Cash but can be cheque, card or transfer. Only fill in a receipt for a payment the user actually
  received; never invent a payer, an amount or a business, and never imitate another company's
  receipt.
compiler: pdflatex
pairs_with:
  - invoice
document: cash-receipt
design: Corporate
# Accent colours, name: "hex". The first is the one template.tex defines.
colors:
  graphite: "374151"
  navy: "1F4E79"
  teal: "0F766E"
  burgundy: "8B1E3F"
  forest: "2D6A4F"
# Form labels for fields whose names are not self-explanatory (pressa.dev/templates form).
labels:
  business: "Your business"
  received_from: "Received from"
  description: "For"
  amount: "Amount received"
